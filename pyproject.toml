[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "synthetic-healthcare-pipeline"
version = "0.1.0"
description = "Educational synthetic healthcare interoperability pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic==2.14.1",
    "fastapi==0.141.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[project.optional-dependencies]
dev = [
    "pytest==8.4.2",
    "httpx==0.28.1",
]
